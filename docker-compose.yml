version: "3.8"
name: chatbot

services:
  mysql:
    image: mysql:8.0
    container_name: chatbot-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatbot_net
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: chatbot-adminer
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ}
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - chatbot_net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  chatbot_net:
    driver: bridge